bandwidth:
  base_dl_bw: 1024.0
  base_ul_bw: 512.0
  distribution: lognormal
  fedfetch_trace_path: fedfetch_bandwidth.pkl
  variance: 0.3
blinding_mask:
  apply_mode: post_topk
  compensation_mode: auto
  enabled: true
  mask_range: 1.0
ckks:
  coeff_mod_bit_sizes:
  - 60
  - 40
  - 40
  - 60
  global_scale: 1099511627776
  packing:
    quant_bits: 16
    strategy: merged
  poly_modulus_degree: 8192
  ptopk:
    client_residual:
      enabled: true
    enable: true
    server_accumulator:
      enabled: false
      mode: none
      momentum_beta: 0.9
      sync_interval: 1
  slot_packing: true
  sparsification:
    batch_size: 4096
    seed: 42
    sparsity_rate: 0.2
    strategy: topk
data:
  alpha: 0.5
  data_dir: ./data
  dataset: mnist
  iid: false
  num_classes: 10
metrics:
  accuracy: true
  ciphertext_size: true
  communication_cost: true
  communication_rounds: true
  compute_time: true
  cpu_utilization: true
  dropout_rate: true
  expansion_ratio: true
  key_distribution_cost: true
  loss: true
  memory_usage: true
model:
  block_config:
  - 6
  - 6
  - 6
  bn_size: 4
  drop_rate: 0.0
  dropout: 0.2
  growth_rate: 12
  hidden_dims:
  - 256
  - 128
  name: lenet
  num_init_features: 24
  width_mult: 1.0
output:
  model_dir: ./history_models
  results_dir: ./results
  save_interval: 999
  viz_dir: ./visualization
prefetch:
  enable_prefetch: true
  max_prefetch_round: 3
  overcommitment: 2
  scheduler_beta: 1.0
  sticky_change_num: 1
  sticky_decay: 0.9
  sticky_group_size: 8
  use_sticky_sampling: true
  warmup_round: 1
system:
  batch_size: 64
  client_sampling_rate: 0.5
  device: cuda
  learning_rate: 0.01
  num_clients: 10
  num_epochs: 5
  num_rounds: 2
  random_seed: 42
  run_plaintext_baseline: false
  upload_difference: true
tee:
  compression:
    enabled: false
    sparsity_rate: 0.8
  enabled: true
visualization:
  dpi: 300
  enabled: true
  figure_size:
  - 10
  - 6
  save_format: png
  style: seaborn-v0_8-whitegrid

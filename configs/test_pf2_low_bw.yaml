bandwidth:
  base_dl_bw: 128.0
  base_ul_bw: 64.0
  distribution: uniform
  variance: 0.3
ckks:
  coeff_mod_bit_sizes:
  - 60
  - 40
  - 40
  - 60
  global_scale: 1099511627776
  poly_modulus_degree: 8192
  slot_packing: true
data:
  alpha: 0.5
  data_dir: ./data
  dataset: mnist
  iid: false
  num_classes: 10
metrics:
  accuracy: true
  ciphertext_size: true
  communication_cost: true
  communication_rounds: true
  compute_time: true
  cpu_utilization: true
  dropout_rate: true
  expansion_ratio: true
  key_distribution_cost: true
  loss: true
  memory_usage: true
model:
  block_config:
  - 6
  - 6
  - 6
  bn_size: 4
  drop_rate: 0.0
  dropout: 0.2
  growth_rate: 12
  hidden_dims:
  - 256
  - 128
  name: lenet
  num_init_features: 24
  width_mult: 1.0
output:
  model_dir: ./history_models
  results_dir: ./results
  save_interval: 999
  viz_dir: ./visualization
prefetch:
  enable_prefetch: true
  max_prefetch_round: 3
  overcommitment: 1.0
  scheduler_beta: 0.5
  sticky_decay: 0.9
  use_sticky_sampling: true
  warmup_round: 1
system:
  batch_size: 64
  client_sampling_rate: 0.5
  device: cpu
  learning_rate: 0.01
  num_clients: 10
  num_epochs: 2
  num_rounds: 5
  random_seed: 42
  run_plaintext_baseline: false
  upload_difference: false
visualization:
  dpi: 300
  enabled: true
  figure_size:
  - 10
  - 6
  save_format: png
  style: seaborn-v0_8-whitegrid

# ============================================================================
# CKKS-Fed / CipherFetch 联邦学习实验配置文件
# ============================================================================
# 本文件控制所有实验行为。为便于批量对比实验，下方每个参数均标注了：
#   �?含义说明
#   �?建议可修改值（建议的实验取值集合）
#   �?若与其他参数存在约束关系，会给出推荐组合
# ============================================================================

# ============================================================================
# 一、系统配�?(system)
# ============================================================================
# 这些参数直接决定联邦学习的规模、强度和硬件需求�?system:
  # --------------------------------------------------------------------------
  # num_clients: 参与联邦学习的客户端总数
  #   建议取�? [5, 10, 20, 50, 100]
  #   说明: 客户端越多，Non-IID 效应越明显，通信总量越大�?  #   本框架在 10~20 客户端规模下测试最充分�?  # --------------------------------------------------------------------------
  num_clients: 10

  # --------------------------------------------------------------------------
  # num_rounds: 联邦学习总通信轮数
  #   建议取�? [10, 20, 50, 100, 200]
  #   说明: 轮数越多模型收敛越好，但线性增加总训练时间�?  #   对于 MNIST/LeNet�?0~50 轮通常已足够收敛�?  # --------------------------------------------------------------------------
  num_rounds: 10

  # --------------------------------------------------------------------------
  # num_epochs: 每轮本地训练�?epoch �?  #   建议取�? [1, 3, 5, 10]
  #   说明: 本地 epoch 越多，每轮计算量越大，通信效率越高（计�?通信比↑），
  #   但本地过拟合风险也增加。通常�?3~5 为平衡值�?  # --------------------------------------------------------------------------
  num_epochs: 5

  # --------------------------------------------------------------------------
  # batch_size: 本地训练批次大小
  #   建议取�? [16, 32, 64, 128, 256]
  #   说明: 较小�?batch 使本地训练噪声更大，有时反而提升联邦泛化能力�?  #   64 �?MNIST/CIFAR 上的常用默认值�?  # --------------------------------------------------------------------------
  batch_size: 64

  # --------------------------------------------------------------------------
  # learning_rate: 本地 SGD 学习�?  #   建议取�? [0.001, 0.01, 0.05, 0.1]
  #   说明: 若使用差值上传（upload_difference=true），服务器直接累加更新，
  #   学习率过大可能导致发散。建议配�?num_epochs 一起调整�?  # --------------------------------------------------------------------------
  learning_rate: 0.01

  # --------------------------------------------------------------------------
  # device: 训练设备
  #   建议取�? ["cpu", "cuda"]
  #   说明: "cuda" 仅在 NVIDIA GPU 可用时生效；不可用时框架自动回退 CPU�?  #   CKKS 加密/解密本身�?CPU 上执行，不受此项影响�?  # --------------------------------------------------------------------------
  device: "cuda"

  # --------------------------------------------------------------------------
  # random_seed: 全局随机种子（影响数据划分、客户端采样、模型初始化等）
  #   建议取�? [0, 42, 123, 2024]
  #   说明: 固定种子可保证实验可复现；更改种子可用于验证结果稳定性�?  # --------------------------------------------------------------------------
  random_seed: 42

  # --------------------------------------------------------------------------
  # run_plaintext_baseline: 是否同时运行明文 FedAvg 对比实验
  #   建议取�? [true, false]
  #   说明: true 时会额外跑一轮不加密的基线，便于对比加密带来的精度损失和开销�?  # --------------------------------------------------------------------------
  run_plaintext_baseline: false

  # --------------------------------------------------------------------------
  # client_sampling_rate: 每轮参与训练的客户端比例
  #   建议取�? [0.1, 0.2, 0.5, 1.0]
  #   说明: 
  #     �?1.0   = 全部参与（传�?FedAvg�?  #     �?0.5   = 半数参与（最常用，平衡效率与收敛�?  #     �?0.1~0.2 = 极端稀疏采样（模拟大规模场景，收敛较慢�?  #   配合 CipherFetch 预取时，未被采样客户端会接收密文增量进行 Prefetch�?  # --------------------------------------------------------------------------
  client_sampling_rate: 0.5

  # --------------------------------------------------------------------------
  # upload_difference: 客户端上�?差�?还是"完整权重"
  #   建议取�? [true, false]
  #   说明:
  #     �?true  = 上传 Δ = W_new - W_old，服务器做累加（FedAvg 标准做法�?  #     �?false = 上传完整 W_new，服务器直接复制（本框架默认值，�?CKKS 加权
  #       平均存在精度损失，完整权重上传可避免误差累积�?  #   ⚠️ 重要: �?upload_difference=false 时，CKKS �?coeff_mod_bit_sizes
  #   不能太长（如 [60,40,40,60]），否则加权平均时的 scale 爆炸会导致精度归零�?  #   推荐配合 [40, 20, 40] + global_scale=2^20 使用�?  # --------------------------------------------------------------------------
  upload_difference: true


# ============================================================================
# 二、数据集配置 (data)
# ============================================================================
data:
  # --------------------------------------------------------------------------
  # dataset: 使用的数据集名称
  #   建议取�? ["mnist", "fashion_mnist", "cifar10", "cifar100", "svhn", "emnist"]
  #   与模型搭配建�?
  #     �?mnist / fashion_mnist / emnist / svhn  �?lenet, mlp, cnn
  #     �?cifar10 / cifar100                     �?mobilenetv2, densenet
  # --------------------------------------------------------------------------
  dataset: "mnist"

  # data_dir: 数据集本地缓存目�?  data_dir: "./data"

  # num_classes: 类别数（程序会根�?dataset 自动推断，通常无需手动设置�?  num_classes: 10

  # --------------------------------------------------------------------------
  # iid: 数据是否独立同分布（IID）划�?  #   建议取�? [true, false]
  #   说明:
  #     �?true  = 每个客户端随机均匀抽样（数据分布相同）
  #     �?false = 使用 Dirichlet 分布进行 Non-IID 划分（见 alpha 参数�?  # --------------------------------------------------------------------------
  iid: false

  # --------------------------------------------------------------------------
  # alpha: Dirichlet 分布浓度参数（仅 iid=false 时生效）
  #   建议取�? [0.1, 0.3, 0.5, 1.0, 5.0, 100.0]
  #   说明:
  #     �?α �?0    极端 Non-IID（每个客户端几乎只有 1~2 个类别）
  #     �?α = 0.5  中度 Non-IID（默认推荐，有明显分布偏移但仍有多类�?  #     �?α = 5.0  轻度 Non-IID（接�?IID�?  #     �?α �?�?   完全 IID
  # --------------------------------------------------------------------------
  alpha: 0.5


# ============================================================================
# 三、模型配�?(model)
# ============================================================================
# 模型选择直接影响参数量、通信量、训练速度和最终精度�?model:
  # --------------------------------------------------------------------------
  # name: 模型架构
  #   建议取�? ["mlp", "cnn", "lenet", "mobilenetv2", "densenet"]
  #   参数量与通信量参考（10 分类�?
  #     �?lenet         ~ 44K params  (~0.17 MB 明文)
  #     �?mlp           ~ 118K params  (~0.45 MB 明文)
  #     �?cnn           ~ 457K params  (~1.74 MB 明文)
  #     �?mobilenetv2   ~ 2.3M params  (~8.8 MB 明文)
  #     �?densenet      ~ 178K params  (~0.68 MB 明文, DenseNet-40)
  #   CKKS 密文膨胀率通常�?10x~20x，因�?lenet/mlp 最适合快速实验�?  # --------------------------------------------------------------------------
  name: "lenet"

  # 以下参数仅在对应模型中生�?  hidden_dims: [256, 128]     # MLP 隐藏层维�?  dropout: 0.2                # MLP/CNN Dropout �?  width_mult: 1.0             # MobileNetV2 宽度乘子 (<1 更轻�?
  growth_rate: 12             # DenseNet growth rate
  block_config: [6, 6, 6]     # DenseNet �?block 层数
  num_init_features: 24       # DenseNet 初始特征�?  bn_size: 4                  # DenseNet bottleneck factor
  drop_rate: 0.0              # DenseNet dropout �?

# ============================================================================
# 四、CKKS 同态加密配�?(ckks)
# ============================================================================
# ⚠️ 这是整个框架中最关键的参数组！三个参数必须配套使用�?# 错误的组合会导致：精度损失过大、scale 爆炸、或无法完成重缩放�?#
# 【核心概念�?#   �?poly_modulus_degree (N): 决定安全等级�?slot 数量。N 越大越安全但越慢�?#   �?coeff_mod_bit_sizes: 系数模数链。总和决定乘法深度；链长度决定重缩放次数�?#   �?global_scale: 明文缩放因子。通常�?2 的幂次�?#
# 【推荐预设组合】（强烈建议整组替换，不要单独改某一个）
# ┌─────────────┬──────────────┬────────────────────────────┬───────────────┬─────────────────────────────�?# �?预设名称     �?N            �?coeff_mod_bit_sizes        �?global_scale  �?适用场景                    �?# ├─────────────┼──────────────┼────────────────────────────┼───────────────┼─────────────────────────────�?# �?轻量快�?    �?4096         �?[40, 20, 40]               �?2^20          �?快速验证、小模型、CPU 环境   �?# �?标准均衡     �?8192         �?[40, 20, 40]               �?2^20          �?默认推荐、通用配置           �?# �?高精度长轮次 �?16384        �?[50, 30, 30, 50]           �?2^30          �?20轮以上、预取累加场�?      �?# �?高精�?      �?8192         �?[60, 40, 40, 60]           �?2^40          �?⚠️ 仅当 upload_difference=true�?# �?高安�?      �?16384        �?[60, 40, 40, 60]           �?2^40          �?高安全需求，通信翻�?        �?# └─────────────┴──────────────┴────────────────────────────┴───────────────┴─────────────────────────────�?#
# 【重要约束�?#   �?upload_difference=false 时，服务器需要执�?"密文 × 权重" 的加权平均�?#   这会导致 scale 变为原来的平方（�?2^20 × 2^20 = 2^40）�?#   如果 coeff_mod_bit_sizes �?[60,40,40,60]，重缩放 60bit �?scale 会崩塌到 ~1�?#   彻底摧毁精度。因�?upload_difference=false 时，必须使用 [40,20,40] + 2^20�?#
# 【长轮次精度警告�?#   [40, 20, 40] + 2^20 的精度余量较小。在预取模式下，客户端会同态累加多轮密�?delta�?#   舍入误差会随轮次累积。超�?~15 轮后可能出现精度崩塌（测试准确率骤降）�?#   若需长轮次稳定运行，建议�?#     1. 改用 upload_difference=true + [60,40,40,60] + 2^40
#     2. 或降�?num_epochs（如 1~2），减少本地漂移对全局模型的冲�?#     3. 或增�?N �?16384，使�?[50,30,30,50] + 2^30
ckks:
  poly_modulus_degree: 8192         # 建议: [4096, 8192, 16384]
  coeff_mod_bit_sizes: [60,40,40,60] # 建议: [[40,20,40], [60,40,40,60]]
  global_scale: 1099511627776             # 2^20；建�? [1048576(2^20), 1073741824(2^30), 2^40(1099511627776)]
  slot_packing: true                # true/false；true 可大幅降低通信量，建议保持开�?
  # --------------------------------------------------------------------------
  # packing: 模型更新打包策略（减�?ciphertext 数量�?  #   建议取�? ["layerwise", "merged", "conjugate", "twotier"]
  #   说明:
  #     �?layerwise  = 逐层加密（默认，兼容原代码）
  #     �?merged     = 合并所有层后统一分块加密（减少碎片，推荐�?  #     �?conjugate  = 复数共轭打包（slot 容量翻倍，密文再减半）
  #     �?twotier    = Two-Pack CKKS 适配版（分层量化 + slot batching�?  #   注意: merged �?LeNet 可减少约 42% ciphertext 数量�?  #         conjugate 需�?TenSEAL 支持复数编码，若不支持则自动回退�?merged�?  #         twotier 不改变密文数量，但通过 per-block 量化提升聚合精度稳定性�?  # --------------------------------------------------------------------------
  packing:
    strategy: "merged"
    quant_bits: 16                    # twotier 专用: 量化比特数，建议 [8, 12, 16]

  # --------------------------------------------------------------------------
  # sparsification: 包级稀疏化（上游通信优化，迁移自 FedPHE�?  #   建议取�?
  #     strategy: ["none", "topk", "randk"]
  #     sparsity_rate: [0.05, 0.1, 0.2, 0.5]
  #     batch_size: [1024, 2048, 4096, 8192]
  #   说明:
  #     �?none   = 无稀疏化（默认，完全兼容原代码）
  #     �?topk   = 保留绝对值平均值最大的 batch
  #     �?randk  = 随机保留 batch
  #   重要约束:
  #     - 仅当 upload_difference=true 时生效（稀疏聚合后需解密为明文更新）
  #     - batch_size 建议等于 slot_count（poly_modulus_degree // 2�?  #     - 启用后客户端 num_ciphertexts 按选中 batch 数计算，upload_cost 大幅下降
  # --------------------------------------------------------------------------
  sparsification:
    strategy: "none"                  # "none" | "topk" | "randk"
    sparsity_rate: 0.1                # 保留�?batch 比例（如 0.1 = 10%�?    batch_size: 4096                  # 每个 batch 的大小，建议等于 slot_count
    seed: 42                          # randk 策略的随机种�?
# ============================================================================
# 五、CipherFetch 密文预取配置 (prefetch)
# ============================================================================
# 本组参数控制 FedFetch 风格的密文预取（CipherFetch）行为�?# 预取的核心思想：未被选中的客户端在后台（idle 时）通过同态加法累加服务器
# 广播的密文增量，从而在下次被选中时减�?fetch 延迟�?prefetch:
  # --------------------------------------------------------------------------
  # enable_prefetch: 是否启用 CipherFetch 预取
  #   建议取�? [true, false]
  #   说明: false 时退化为标准 CKKS-Fed（无预取、无带宽模拟、无 sticky sampling）�?  # --------------------------------------------------------------------------
  enable_prefetch: true

  # --------------------------------------------------------------------------
  # use_sticky_sampling: 是否启用 Sticky Sampling 客户端选择
  #   建议取�? [true, false]
  #   说明:
  #     �?false = 每轮完全随机采样（传统方式）
  #     �?true  = �?future_round 预采样一个客户端池，被预取但未选中的客户端
  #       获得 sticky score，提高未来被选中的概率，避免带宽浪费�?  #   当设�?true 时，建议�?overcommitment 设为 2.0 以上�?  # --------------------------------------------------------------------------
  use_sticky_sampling: true

  # --------------------------------------------------------------------------
  # max_prefetch_round: 最大提前预取轮数（预取窗口大小 W�?  #   建议取�? [1, 2, 3, 5]
  #   说明: 服务器在�?R 轮会为第 R+W 轮的客户端决定预取调度�?  #   W 越大，预取越激进，但调度误差（EMA 估计不准）也越大。推�?2~3�?  # --------------------------------------------------------------------------
  max_prefetch_round: 3

  # --------------------------------------------------------------------------
  # warmup_round: 预热轮数（前 N 轮不调度预取、不广播密文增量�?  #   建议取�? [0, 1, 2, 3]
  #   说明: 预热期间收集 EMA 轮次耗时和带宽基线，为后续调度提供数据�?  #   论文�?rounds 1..R 的训练客户端不是被预采样的，但系统仍可为 future rounds 预取�?  #   设为 0 表示从第 1 轮就开始预取调度�?  # --------------------------------------------------------------------------
  warmup_round: 1

  # --------------------------------------------------------------------------
  # scheduler_beta: T_percentile 松弛系数
  #   建议取�? [0.0, 0.3, 0.5, 0.7, 1.0]
  #   说明: 控制调度器对"慢客户端"的容忍度�?  #     �?β = 0   最严格（只有最快客户端能被成功预取�?  #     �?β = 0.5 平衡（默认推荐）
  #     �?β = 1   最宽松（几乎所有客户端都能被调度预取）
  #   仅当 overcommitment > 1 时效果才明显�?  # --------------------------------------------------------------------------
  scheduler_beta: 1.0

  # --------------------------------------------------------------------------
  # overcommitment (OC): 过承诺比�?  #   建议取�? [1.0, 1.5, 2.0, 3.0]
  #   说明:
  #     �?OC = 1.0  预采样数 = 实际需要数（无冗余，sticky sampling 失效�?  #     �?OC = 2.0  预采样数 = 2 × 实际需要数（推荐配�?sticky sampling 使用�?  #     �?OC 越大，预采样池越大，掉线容忍度越高，但预取广播量也线性增加�?  #   推荐实验组合:
  #     (use_sticky_sampling=false, OC=1.0)  �?基线对比
  #     (use_sticky_sampling=true,  OC=2.0)  �?Sticky Sampling 最优配�?  # --------------------------------------------------------------------------
  overcommitment: 2.0

  # --------------------------------------------------------------------------
  # sticky_decay: Sticky Sampling 选中�?score 衰减因子
  #   建议取�? [0.5, 0.7, 0.8, 0.9, 0.95]
  #   说明: 被选中的客户端 score 乘以该因子，防止垄断�?  #   越小衰减越快，公平性越高，但可能导致采样过于随机�?  #   仅当 use_sticky_sampling=true 时生效�?  # --------------------------------------------------------------------------
  sticky_decay: 0.9

  # --------------------------------------------------------------------------
  # sticky_group_size: Sticky Group 大小（FedFetch 中的 k�?  #   建议取�? [num_needed * 1.5, num_needed * 2]
  #   说明: sticky_group 是带宽较好的客户端候选池，每轮从中选大部分�?  #   再从外部随机替换少量。group_size 越大，选择越稳定�?  #   仅当 use_sticky_sampling=true 时生效�?  # --------------------------------------------------------------------------
  sticky_group_size: 8

  # --------------------------------------------------------------------------
  # sticky_change_num: 每轮替换的客户端数（FedFetch 中的 change_num�?  #   建议取�? [1, 2, max(1, num_needed * 0.2)]
  #   说明: 每轮�?sticky_group 外部随机引入多少新客户端，保持多样性�?  #   设为 0 表示完全不替换（sticky_group 固定）�?  #   仅当 use_sticky_sampling=true 时生效�?  # --------------------------------------------------------------------------
  sticky_change_num: 1


# ============================================================================
# 六、带宽模拟配�?(bandwidth)
# ============================================================================
# 用于模拟异构网络环境，影�?PrefetchScheduler 的调度决策和虚拟时钟计算�?bandwidth:
  # --------------------------------------------------------------------------
  # base_dl_bw: 基础下行带宽 (kbps)
  #   建议取�? [256.0, 512.0, 1024.0, 2048.0, 4096.0, 10240.0]
  #   说明: 
  #     �?256~512   kbps  �?2G/3G 移动网络
  #     �?1024~2048 kbps  �?4G / 家庭 WiFi
  #     �?4096+     kbps  �?5G / 光纤
  #   实际带宽 = base_dl_bw × uniform/lognormal 随机因子�?  # --------------------------------------------------------------------------
  base_dl_bw: 1024.0

  # --------------------------------------------------------------------------
  # base_ul_bw: 基础上行带宽 (kbps)
  #   建议取�? [128.0, 256.0, 512.0, 1024.0]
  #   说明: 上行通常比下行慢，建议设为下行的 0.3~0.5 倍�?  # --------------------------------------------------------------------------
  base_ul_bw: 512.0

  # --------------------------------------------------------------------------
  # variance: 带宽变异系数 [0, 1)
  #   建议取�? [0.1, 0.3, 0.5, 0.7]
  #   说明: 越大客户端间带宽差异越大�?  #     �?0.1  几乎同构（所有客户端带宽相近�?  #     �?0.3  中度异构（默认推荐）
  #     �?0.5+ 高度异构（模拟极端设备差异）
  # --------------------------------------------------------------------------
  variance: 0.3

  # --------------------------------------------------------------------------
  # distribution: 带宽分布类型
  #   建议取�? ["uniform", "lognormal"]
  #   说明:
  #     �?uniform    带宽�?[base×(1-var), base×(1+var)] 内均匀分布
  #     �?lognormal  更符合真实网络：多数客户端接近均值，少数极慢/极快
  # --------------------------------------------------------------------------
  distribution: "uniform"


# ============================================================================
# 七、实验指标配�?(metrics)
# ============================================================================
# 控制哪些指标被记录到 results/metrics.json 中�?# 全部为布尔开关，true = 记录，false = 跳过�?metrics:
  compute_time: true
  communication_cost: true
  ciphertext_size: true
  expansion_ratio: true
  accuracy: true
  loss: true
  communication_rounds: true
  dropout_rate: true
  cpu_utilization: true
  key_distribution_cost: true
  memory_usage: true


# ============================================================================
# 八、可视化配置 (visualization)
# ============================================================================
visualization:
  enabled: true
  save_format: "png"                # 建议: ["png", "pdf", "svg"]
  dpi: 300                          # 建议: [150, 300, 600]
  figure_size: [10, 6]              # 建议: [8,5], [10,6], [12,8]

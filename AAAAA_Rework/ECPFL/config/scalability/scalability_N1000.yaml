# ============================================================================
# ECPFL 扩展性实验：N=1000、K=500（采样率 0.5），MNIST + LeNet
# ============================================================================
# 公共参数：MNIST + lenet、τ=3、R=3、β=1.5、RK-0.1、ζ=0.1、
#           γ_d=0.9/γ_s=0.8、n=4096、Δ=2^20、p=2^45、eta=4、cuda、dropout=0
# 注意：K=500 时 logp=50 会导致 p·K·eta 超过 Q/2，故将 logp 降至 45。
# 大 N 训练成本高，但仍跑满 50 轮以与 N50/N100/N500 保持一致
# 运行命令：
#   python main_ecpfl.py --config AAAAA_Rework/ECPFL/config/scalability/scalability_N1000.yaml --output-dir AAAAA_Rework/ECPFL/result/scalability
# ============================================================================
system:
  num_clients: 1000
  num_rounds: 50
  num_epochs: 3
  batch_size: 64
  learning_rate: 0.001
  device: "cuda"
  random_seed: 42

data:
  dataset: "mnist"
  data_dir: "./data"
  num_classes: 10
  iid: true
  alpha: 0.5

model:
  name: "lenet"

ecpfl:
  n: 4096
  tau: 3
  sparsity_rate: 0.1
  vote_rule: "rk"
  vote_threshold: 0.1
  logp: 45
  delta_scale: 1048576
  eta: 4
  max_abs_x: 1.0
  sampling:
    active_count: 500
    prefetch_rounds: 3
    overcommit: 1.5
  dropout_rate: 0
  gamma_d: 0.9
  gamma_s: 0.8
  prefetch:
    enabled: true
    bandwidth:
      base_dl_bw: 8192.0
      base_ul_bw: 4096.0
      distribution: "uniform"
      filter_low_bandwidth: false
      max_dl_bw_kbps: 8192.0
      max_ul_bw_kbps: 4096.0
      min_dl_bw_kbps: 5120
      min_ul_bw_kbps: 5120

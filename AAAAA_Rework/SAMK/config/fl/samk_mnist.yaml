# ============================================================================
# SAMK（TDSC 2025）实验配置 —— fl 模式（MNIST 真实联邦训练 + SAMK 加密聚合）
# 复现命令：
#   python main_samk.py --config AAAAA_Rework/SAMK/config/fl/samk_mnist.yaml \
#          --output-dir AAAAA_Rework/SAMK/result/fl
# 说明：max_dim=0 -> 全量参数加密（论文口径）；客户端上传的是本轮模型增量
#       Δw = w_local - w_global，服务器聚合 Σ Δw 后做 FedAvg 平均更新。
# ============================================================================
system:
  num_clients: 12
  num_rounds: 3
  num_epochs: 1
  batch_size: 64
  learning_rate: 0.001
  device: "cpu"
  random_seed: 42

data:
  dataset: "mnist"
  data_dir: "./data"
  num_classes: 10
  iid: true
  alpha: 0.5

model:
  name: "mlp"
  hidden_dims: [16]      # 参数量 784*16+16 + 16*10+10 = 12730 维
  dropout: 0.1

samk:
  mode: "fl"
  n: 1024
  t_bits: 40
  scale_bits: 16
  paillier_bits: 512
  max_dim: 0             # 0/负数 = 全量加密（12730 维 -> 13 个 BFV 密文块）
  min_online: 2

sampling:
  active_count: 8
  overcommit: 1.5
  prefetch_rounds: 2
  dropout_rate: 0.25

client_selection:
  strategy: "sticky"
  sticky:
    score_decay: 0.9

prefetch:
  overcommitment: 1.5
  sticky_change_num: 1

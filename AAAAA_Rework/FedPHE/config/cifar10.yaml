# ============================================================================
# CKKS-Fed / CipherFetch 联邦学习实验配置文件
# ============================================================================
# 本文件控制所有实验行为。为便于批量对比实验，下方每个参数均标注了：
#   • 含义说明
#   • 建议可修改值（建议的实验取值集合）
#   • 若与其他参数存在约束关系，会给出推荐组合
# ============================================================================

# ============================================================================
# 零、客户端选择策略配置 (client_selection)
# ============================================================================
# 控制每轮如何选择参与训练的客户端。支持可插拔策略切换。
client_selection:
  # --------------------------------------------------------------------------
  # strategy: 客户端选择策略
  #   建议取值: ["random", "sticky", "sketch_clustering", "poc", "tifl", "haccs", "oort"]
  #   说明:
  #     • random            = 纯随机采样（最简单，公平性好但无系统优化）
  #     • sticky            = Sticky Sampling（FedFetch 风格，优先选快客户端）
  #     • sketch_clustering = 草图聚类（FedPHE 风格，选代表性客户端）
  #     • poc               = Power-of-Choice（AISTATS 2022，选 loss 大的客户端）
  #     • tifl              = Tier-based FL（HPDC 2020，按带宽分层选客户端）
  #     • haccs             = HACCS（IPDPS 2022，按资源画像聚类后均衡选取）
  #     • oort              = Oort（OSDI 2021，ε-greedy 效用最大化选取）
  #   当 prefetch.enable_prefetch=true 时，sticky 策略会自动启用预取调度。
  #   其他策略（poc/tifl/haccs/oort）在预取模式下同样可用，但需评估与 OC 截断的兼容性。
  # --------------------------------------------------------------------------
  strategy: "sketch_clustering"

  # --------------------------------------------------------------------------
  # sketch_clustering 专用参数（仅 strategy="sketch_clustering" 时生效）
  # --------------------------------------------------------------------------
  sim_len: 64                       # MinHash 签名维度
  quan_threshold: 0.05              # 量化阈值（绝对值小于此值视为 0）
  selection_interval: 0            # 每隔多少轮重新聚类（0=每轮都聚类）
  max_k: null                       # 最大聚类数（null=自动设为 num_clients//2）

  # --------------------------------------------------------------------------
  # sticky 专用参数（仅 strategy="sticky" 时生效，对齐 FedFetch）
  # --------------------------------------------------------------------------
  sticky:
    # group_size: 粘性组大小 k。
    #   - null (默认) = 自动设为 num_clients，包含所有客户端作为候选池
    #   - 整数       = 显式限制 group 大小（如 8）。若 group_size < num_needed，
    #                  代码会自动从全体客户端中按带宽扩展 sticky group
    #   推荐: 保持 null，让代码自适应；或设为 >= num_needed * OC
    group_size: null
    change_num_base: 3              # 基础替换数。change_num = round(base * overcommitment)
    enable_score: false             # 是否启用 score 加权（超出 FedFetch 原文的公平性增强）
    score_decay: 0.9                # 选中后 score 衰减因子 [0,1]，仅 enable_score=true 时生效

  # --------------------------------------------------------------------------
  # Power-of-Choice (PoC) 专用参数（仅 strategy="poc" 时生效）
  # --------------------------------------------------------------------------
  poc:
    # d: 候选池大小
    #   - null (默认) = 自动计算为 num_needed * 2
    #     AISTATS 2022 论文推荐：候选池应为选中人数的 2 倍
    #   - 整数 = 显式指定，但代码会确保 d >= num_needed 且 d <= num_clients
    #   约束: d 必须 >= num_needed，否则候选池不够大，PoC 退化为"全选"
    d: null

  # --------------------------------------------------------------------------
  # TiFL 专用参数（仅 strategy="tifl" 时生效）
  # --------------------------------------------------------------------------
  tifl:
    # num_tiers: 带宽分层数
    #   - null (默认) = 自动计算
    #     约束: 每层人数 >= num_needed，避免频繁跨层借用退化
    #     公式: clamp(floor(N / num_needed), 2, 5)
    #     例: 30 clients, rate=0.5 -> num_needed=15 -> num_tiers=2
    #   - 整数 = 显式指定
    num_tiers: null

  # --------------------------------------------------------------------------
  # HACCS 专用参数（仅 strategy="haccs" 时生效）
  # --------------------------------------------------------------------------
  haccs:
    # num_clusters: 聚类数
    #   - null (默认) = 自动计算，公式: clamp(sqrt(num_clients), 3, num_needed//2)
    #     保证每个簇至少贡献 2 个客户端，避免名额浪费
    #   - 整数       = 显式指定聚类数
    #   建议: 保持 null，让代码自适应；或设为 5~10（30 客户端场景）
    num_clusters: null
    recluster_interval: 0           # 重新聚类间隔（0=每轮都聚类，节省开销可设 5~10）

  # --------------------------------------------------------------------------
  # Oort 专用参数（仅 strategy="oort" 时生效）
  # --------------------------------------------------------------------------
  oort:
    exploration_factor: 0.1         # ε-greedy 探索率。0=纯利用，1=纯随机
    util_time_alpha: 1.0            # 时间惩罚系数。越大越偏好快客户端

  # --------------------------------------------------------------------------
  # 公平性包装器（可叠加到任意策略上）
  # --------------------------------------------------------------------------
  fairness:
    enabled: false                  # true = 强制保证最低参与率
    min_participation_ratio: 0.3    # 每个客户端至少参与总轮数的 30%


# ============================================================================
# 一、系统配置 (system)
# ============================================================================
# 这些参数直接决定联邦学习的规模、强度和硬件需求。
system:
  # --------------------------------------------------------------------------
  # num_clients: 参与联邦学习的客户端总数
  #   建议取值: [5, 10, 20, 50, 100]
  #   说明: 客户端越多，Non-IID 效应越明显，通信总量越大。
  #   本框架在 10~20 客户端规模下测试最充分。
  # --------------------------------------------------------------------------
  num_clients: 50

  # --------------------------------------------------------------------------
  # num_rounds: 联邦学习总通信轮数
  #   建议取值: [10, 20, 50, 100, 200]
  #   说明: 轮数越多模型收敛越好，但线性增加总训练时间。
  #   对于 MNIST/LeNet，20~50 轮通常已足够收敛。
  # --------------------------------------------------------------------------
  num_rounds: 50

  # --------------------------------------------------------------------------
  # num_epochs: 每轮本地训练的 epoch 数
  #   建议取值: [1, 3, 5, 10]
  #   说明: 本地 epoch 越多，每轮计算量越大，通信效率越高（计算/通信比↑），
  #   但本地过拟合风险也增加。通常取 3~5 为平衡值。
  # --------------------------------------------------------------------------
  num_epochs: 3

  # --------------------------------------------------------------------------
  # batch_size: 本地训练批次大小
  #   建议取值: [16, 32, 64, 128, 256]
  #   说明: 较小的 batch 使本地训练噪声更大，有时反而提升联邦泛化能力。
  #   64 是 MNIST/CIFAR 上的常用默认值。
  # --------------------------------------------------------------------------
  batch_size: 64

  # --------------------------------------------------------------------------
  # learning_rate: 本地 SGD 学习率
  #   建议取值: [0.001, 0.01, 0.05, 0.1]
  #   说明: 若使用差值上传（upload_difference=true），服务器直接累加更新，
  #   学习率过大可能导致发散。建议配合 num_epochs 一起调整。
  # --------------------------------------------------------------------------
  learning_rate: 0.001

  # --------------------------------------------------------------------------
  # device: 训练设备
  #   建议取值: ["cpu", "cuda"]
  #   说明: "cuda" 仅在 NVIDIA GPU 可用时生效；不可用时框架自动回退 CPU。
  #   CKKS 加密/解密本身在 CPU 上执行，不受此项影响。
  # --------------------------------------------------------------------------
  device: "cuda"

  # --------------------------------------------------------------------------
  # random_seed: 全局随机种子（影响数据划分、客户端采样、模型初始化等）
  #   建议取值: [0, 42, 123, 2024]
  #   说明: 固定种子可保证实验可复现；更改种子可用于验证结果稳定性。
  # --------------------------------------------------------------------------
  random_seed: 42

  # --------------------------------------------------------------------------
  # run_plaintext_baseline: 是否同时运行明文 FedAvg 对比实验
  #   建议取值: [true, false]
  #   说明: true 时会额外跑一轮不加密的基线，便于对比加密带来的精度损失和开销。
  # --------------------------------------------------------------------------
  run_plaintext_baseline: false

  # --------------------------------------------------------------------------
  # client_sampling_rate: 每轮参与训练的客户端比例
  #   建议取值: [0.1, 0.2, 0.5, 1.0]
  #   说明:
  #     • 1.0   = 全部参与（传统 FedAvg）
  #     • 0.5   = 半数参与（最常用，平衡效率与收敛）
  #     • 0.1~0.2 = 极端稀疏采样（模拟大规模场景，收敛较慢）
  #   配合 CipherFetch 预取时，未被采样客户端会接收密文增量进行 Prefetch。
  # --------------------------------------------------------------------------
  client_sampling_rate: 0.5

  # --------------------------------------------------------------------------
  # upload_difference: 客户端上传"差值"还是"完整权重"
  #   建议取值: [true, false]
  #   说明:
  #     • true  = 上传 Δ = W_new - W_old，服务器做累加（FedAvg 标准做法）
  #     • false = 上传完整 W_new，服务器直接复制（本框架默认值，因 CKKS 加权
  #       平均存在精度损失，完整权重上传可避免误差累积）
  #   ⚠️ 重要: 当 upload_difference=false 时，CKKS 的 coeff_mod_bit_sizes
  #   不能太长（如 [60,40,40,60]），否则加权平均时的 scale 爆炸会导致精度归零。
  #   推荐配合 [40, 20, 40] + global_scale=2^20 使用。
  # --------------------------------------------------------------------------
  upload_difference: true

  # --------------------------------------------------------------------------
  # 优化器配置 (optimizer)
  # --------------------------------------------------------------------------
  optimizer:
    name: "adam"                   # "sgd" | "adam" | "adamw"
    lr: 0.001                      # 学习率（若设置则覆盖 system.learning_rate）adam推荐0.001
    momentum: 0.9                 # SGD 动量系数（仅 name="sgd" 时有效）

  # --------------------------------------------------------------------------
  # 学习率调度器配置 (lr_scheduler)
  # --------------------------------------------------------------------------
  lr_scheduler:
    enabled: false                # true = 启用学习率衰减
    name: "step"                  # "step" | "cosine" | "exponential"
    step_size: 10                  # step 模式：每隔 N 个本地 epoch 衰减一次
    gamma: 0.5                    # 衰减系数（step/exponential 共用）
    T_max: 30                     # cosine 模式：总 epoch 数（默认 num_rounds * num_epochs）
    eta_min: 0.0                  # cosine 模式：最小学习率


# ============================================================================
# 二、数据集配置 (data)
# ============================================================================
data:
  # --------------------------------------------------------------------------
  # dataset: 使用的数据集名称
  #   建议取值: ["mnist", "fashion_mnist", "cifar10", "cifar100", "svhn", "emnist"]
  #   与模型搭配建议:
  #     • mnist / fashion_mnist / emnist / svhn  → lenet, mlp, cnn
  #     • cifar10 / cifar100                     → mobilenetv2, densenet
  # --------------------------------------------------------------------------
  dataset: "cifar10"

  # data_dir: 数据集本地缓存目录
  data_dir: "./data"

  # num_classes: 类别数（程序会根据 dataset 自动推断，通常无需手动设置）
  num_classes: 10

  # --------------------------------------------------------------------------
  # iid: 数据是否独立同分布（IID）划分
  #   建议取值: [true, false]
  #   说明:
  #     • true  = 每个客户端随机均匀抽样（数据分布相同）
  #     • false = 使用 Dirichlet 分布进行 Non-IID 划分（见 alpha 参数）
  # --------------------------------------------------------------------------
  iid: false

  # --------------------------------------------------------------------------
  # alpha: Dirichlet 分布浓度参数（仅 iid=false 时生效）
  #   建议取值: [0.1, 0.3, 0.5, 1.0, 5.0, 100.0]
  #   说明:
  #     • α → 0    极端 Non-IID（每个客户端几乎只有 1~2 个类别）
  #     • α = 0.5  中度 Non-IID（默认推荐，有明显分布偏移但仍有多类）
  #     • α = 5.0  轻度 Non-IID（接近 IID）
  #     • α → ∞    完全 IID
  # --------------------------------------------------------------------------
  alpha: 1


# ============================================================================
# 三、模型配置 (model)
# ============================================================================
# 模型选择直接影响参数量、通信量、训练速度和最终精度。
model:
  # --------------------------------------------------------------------------
  # name: 模型架构
  #   建议取值: ["mlp", "cnn", "lenet", "mobilenetv2", "densenet", "resnet18",
  #              "deepcnn", "vggnobn",
  #              "cnn_cifar", "cnn_fmnist", "resnet20", "resnet32",
  #              "mnist2nn", "alexnet_cifar", "alexnet_mnist", "cryptonet", "lstm",
  #              "shufflenet"]
  #   参数量与通信量参考（10 分类）:
  #     • lenet         ~ 44K params  (~0.17 MB 明文)
  #     • mlp           ~ 118K params  (~0.45 MB 明文)
  #     • cnn           ~ 457K params  (~1.74 MB 明文)
  #     • mobilenetv2   ~ 2.3M params  (~8.8 MB 明文)
  #     • densenet      ~ 178K params  (~0.68 MB 明文, DenseNet-40)
  #     • resnet18      ~ 11.2M params (~42.6 MB 明文)
  #     • deepcnn       ~ 80K params   (~0.30 MB 明文)
  #     • vggnobn       ~ 9.7M params  (~37.2 MB 明文)
  #     • shufflenet    ~ 914K params  (~3.49 MB 明文, g3_w1)
  #   CKKS 密文膨胀率通常在 10x~20x，因此 lenet/mlp 最适合快速实验。
  #
  # 【模型来源与适用数据集速查】
  #   模型名称        来源项目                    适用数据集
  #   ─────────────  ──────────────────────────  ───────────────────────────────
  #   mlp            本框架内置                   MNIST/Fashion-MNIST/EMNIST/CIFAR
  #   cnn            本框架内置                   MNIST/Fashion-MNIST/CIFAR/SVHN
  #   lenet          本框架内置                   MNIST/Fashion-MNIST/CIFAR
  #   mobilenetv2    本框架内置                   CIFAR-10/100/SVHN
  #   densenet       本框架内置                   CIFAR-10/100/SVHN
  #   resnet18       本框架内置                   CIFAR-10/100/SVHN
  #   deepcnn        本框架内置                   MNIST/Fashion-MNIST/CIFAR
  #   vggnobn        本框架内置                   CIFAR-10/100
  #   cnn_cifar      FedPHE-main                 CIFAR-10/100
  #   cnn_fmnist     FedPHE-main                 Fashion-MNIST
  #   resnet20/32    FedPHE-main                 CIFAR-10/100
  #   mnist2nn       FedDMC-main / fedavgpy      MNIST/Fashion-MNIST
  #   alexnet_cifar  FedSHE                      CIFAR-10/100
  #   alexnet_mnist  FedSHE                      MNIST/Fashion-MNIST
  #   cryptonet      ckks_cryptonet              MNIST/Fashion-MNIST/CIFAR
  #   lstm           Federated-Learning-master   Shakespeare/sent140 (序列数据)
  #   shufflenet     FedFetch-main               CIFAR-10/100/SVHN/MNIST
  # --------------------------------------------------------------------------

  #name: "cnn_fmnist"   # Fashion-MNIST 公平对比
  # name: "cnn_cifar"  # CIFAR 轻量 CNN 对比
  # name: "resnet20"   # CIFAR ResNet20 对比
  # name: "resnet32"   # CIFAR ResNet32 对比
  # --------------------------------------------------------------------------
  name: "resnet20"


  # 以下参数仅在对应模型中生效
  hidden_dims: [256, 128]     # MLP 隐藏层维度
  dropout: 0.2                # MLP/CNN Dropout 率
  width_mult: 1.0             # MobileNetV2 宽度乘子 (<1 更轻量)
  growth_rate: 12             # DenseNet growth rate
  block_config: [6, 6, 6]     # DenseNet 每 block 层数
  num_init_features: 24       # DenseNet 初始特征数
  bn_size: 4                  # DenseNet bottleneck factor
  drop_rate: 0.0              # DenseNet dropout 率

  # LSTM / 序列模型专用参数
  vocab_size: 80              # 词表大小 (LSTM)
  embed_dim: 8                # 词嵌入维度 (LSTM)
  hidden_dim: 256             # LSTM 隐藏层维度
  num_layers: 2               # LSTM 层数
  lstm_dropout: 0.5           # LSTM Dropout 率

  # ShuffleNet 专用参数
  shufflenet_groups: 3         # 分组卷积的组数 (1/2/3/4/8)，推荐 3
  shufflenet_width: 1.0        # 宽度乘子 (1.0=标准, 0.5=半宽, 0.25=四分之一宽)


# ============================================================================
# 四、CKKS 同态加密配置 (ckks)
# ============================================================================
# ⚠️ 这是整个框架中最关键的参数组！三个参数必须配套使用。
# 错误的组合会导致：精度损失过大、scale 爆炸、或无法完成重缩放。
#
# 【核心概念】
#   • poly_modulus_degree (N): 决定安全等级和 slot 数量。N 越大越安全但越慢。
#   • coeff_mod_bit_sizes: 系数模数链。总和决定乘法深度；链长度决定重缩放次数。
#   • global_scale: 明文缩放因子。通常是 2 的幂次。
#
# 【推荐预设组合】（强烈建议整组替换，不要单独改某一个）
# ┌─────────────┬──────────────┬────────────────────────────┬───────────────┬─────────────────────────────┐
# │ 预设名称     │ N            │ coeff_mod_bit_sizes        │ global_scale  │ 适用场景                    │
# ├─────────────┼──────────────┼────────────────────────────┼───────────────┼─────────────────────────────┤
# │ 轻量快速     │ 4096         │ [40, 20, 40]               │ 2^20          │ 快速验证、小模型、CPU 环境   │
# │ 标准均衡     │ 8192         │ [40, 20, 40]               │ 2^20          │ 默认推荐、通用配置           │
# │ 高精度长轮次 │ 16384        │ [50, 30, 30, 50]           │ 2^30          │ 20轮以上、预取累加场景       │
# │ 高精度       │ 8192         │ [60, 40, 40, 60]           │ 2^40          │ ⚠️ 仅当 upload_difference=true│
# │ 高安全       │ 16384        │ [60, 40, 40, 60]           │ 2^40          │ 高安全需求，通信翻倍         │
# └─────────────┴──────────────┴────────────────────────────┴───────────────┴─────────────────────────────┘
#
# 【重要约束】
#   当 upload_difference=false 时，服务器需要执行 "密文 × 权重" 的加权平均。
#   这会导致 scale 变为原来的平方（如 2^20 × 2^20 = 2^40）。
#   如果 coeff_mod_bit_sizes 为 [60,40,40,60]，重缩放 60bit 后 scale 会崩塌到 ~1，
#   彻底摧毁精度。因此 upload_difference=false 时，必须使用 [40,20,40] + 2^20。
#
# 【长轮次精度警告】
#   [40, 20, 40] + 2^20 的精度余量较小。在预取模式下，客户端会同态累加多轮密文 delta，
#   舍入误差会随轮次累积。超过 ~15 轮后可能出现精度崩塌（测试准确率骤降）。
#   若需长轮次稳定运行，建议：
#     1. 改用 upload_difference=true + [60,40,40,60] + 2^40
#     2. 或降低 num_epochs（如 1~2），减少本地漂移对全局模型的冲击
#     3. 或增大 N 到 16384，使用 [50,30,30,50] + 2^30
ckks:
  poly_modulus_degree: 8192         # 建议: [4096, 8192, 16384]
  coeff_mod_bit_sizes: [60,40,40,60] # 建议: [[40,20,40], [60,40,40,60]]
  global_scale: 1099511627776             # 2^20；建议: [1048576(2^20), 1073741824(2^30), 2^40(1099511627776)]
  slot_packing: true                # true/false；true 可大幅降低通信量，建议保持开启

  # --------------------------------------------------------------------------
  # packing: 模型更新打包策略（减少 ciphertext 数量）
  #   建议取值: ["layerwise", "merged", "conjugate", "twotier", "crtstack"]
  #   说明:
  #     • layerwise  = 逐层加密（默认，兼容原代码）
  #     • merged     = 合并所有层后统一分块加密（减少碎片，推荐）
  #     • conjugate  = 复数共轭打包（slot 容量翻倍，密文再减半）
  #     • twotier    = Two-Pack CKKS 适配版（分层量化 + slot batching）
  #     • crtstack   = CRT-Stack 压缩打包（4x 压缩，8-bit 量化 + CRT 编码）
  #   注意: merged 对 LeNet 可减少约 42% ciphertext 数量；
  #         conjugate 需要 TenSEAL 支持复数编码，若不支持则自动回退到 merged；
  #         twotier 不改变密文数量，但通过 per-block 量化提升聚合精度稳定性；
  #         crtstack 提供 4x 传输压缩，但聚合时退化为明文加权平均（噪声敏感）。
  # --------------------------------------------------------------------------
  packing:
    strategy: "merged"
    crt_layers: 4                     # CRT 层数 d（每 slot 存 d 个值）
    crt_quant_bits: 8                 # 量化位宽，建议 8
    # crt_moduli: [257, 263, 269, 271]  # 可选：自定义 CRT 模数（必须两两互素）
    quant_bits: 16                    # twotier 专用: 量化比特数，建议 [8, 12, 16]

  # --------------------------------------------------------------------------
  # sparsification: 客户端本地包级稀疏化（隐私安全：只上传 mask，不上传明文梯度）
  #
  # 【修正后的隐私安全流程】
  #   1. 客户端本地训练得到明文梯度
  #   2. 客户端本地按本配置计算 mask（0/1 向量，基于梯度打分）
  #   3. 客户端只上传 mask 给服务器（~67 bytes，极小）
  #   4. 服务器按 global_mask_vote 配置聚合所有 client masks → global_mask
  #   5. 服务器广播 global_mask 给所有客户端
  #   6. 客户端按 global_mask 加密上传对应 batch
  #
  # 【重要】
  #   • strategy = "none" 时：客户端不计算 mask，不上传 mask，global_mask_vote 不生效
  #     客户端直接上传完整加密梯度。
  #   • strategy != "none" 时：客户端本地计算 mask，sparsity_rate / scoring_method
  #     控制客户端本地 TopK 行为。global_mask_vote 控制服务器端聚合方式。
  #
  # 【原理】
  #   将模型更新扁平化为一个长数组，按固定 batch_size 切分为多个 batch（包）。
  #   每个 batch 对应一个 CKKS SIMD 密文块（slot_count = poly_modulus_degree / 2）。
  #   客户端只选择最重要（TopK）或随机（RandK）的 batch 投票给服务器。
  #
  # 【策略说明】
  #   • none  = 无稀疏化（默认，上传完整加密梯度）
  #   • topk  = 按 batch 内绝对值平均值排序，保留最大的 top-k% batch
  #   • randk = 每轮使用 round_num + seed 作为随机种子，随机保留 k% batch
  #
  # 【建议配置】
  #   ┌─────────────┬─────────────┬─────────────┬─────────────────────────────┐
  #   │ 场景        │ strategy    │ sparsity_rate│ 说明                        │
  #   ├─────────────┼─────────────┼─────────────┼─────────────────────────────┤
  #   │ 高精度要求  │ none        │ —           │ 不牺牲任何信息，通信量最大   │
  #   │ 均衡（推荐）│ topk        │ 0.3         │ 保留 30% batch 投票          │
  #   │ 高压缩      │ topk        │ 0.1         │ 保留 10% batch 投票          │
  #   │ 隐私增强    │ randk       │ 0.3         │ 随机选择，防御梯度推断攻击   │
  #   └─────────────┴─────────────┴─────────────┴─────────────────────────────┘
  #
  # 【重要约束】
  #   - batch_size 不应超过 slot_count（poly_modulus_degree // 2 = 4096）
  #   - sparsity_rate 是客户端本地投票比例，global_mask 最终覆盖率由
  #     global_mask_vote.mode 决定（union 覆盖最广，topk 最激进）
  # --------------------------------------------------------------------------
  sparsification:
    strategy: "topk"                  # "none" | "topk" | "randk"
    sparsity_rate: 0.5                # 客户端本地保留的 batch 投票比例
    batch_size: 4096                  # 每个 batch 的大小，建议等于 slot_count
    seed: 42                          # randk 策略的随机种子

    # 【可插拔】TopK 评分方式（仅 strategy="topk" 时生效）
    #   avg_abs : 绝对值平均值  avg(|x|)     【默认，最稳定】
    #   l2_norm : L2 范数       ||x||_2      【对大值更敏感】
    #   l1_norm : L1 范数       sum(|x|)     【与 avg_abs 正相关】
    #   max_abs : 最大绝对值    max(|x|)     【只关注最极端值】
    scoring_method: "l2_norm"

    # 【可插拔】warmup 期间跳过客户端稀疏化
    # false = 老行为（默认）：从一开始就启用稀疏化，无 warmup 阶段
    # true  = 新行为：warmup 期间不稀疏化，warmup 结束后再启用稀疏化
    use_warmup_skip_sparse: false
    warmup_rounds: 2                 # warmup 轮数，仅当开关为 true 时生效

    # 【可插拔】FedPHE 本地补全（local completion）
    # 作用：全局稀疏 delta 为 0 的位置，用客户端上一轮本地训练值填充。
    #   true  = 启用本地补全（推荐，避免 TopK 导致 BN 失配和精度崩塌）
    #   false = 禁用本地补全（回退到旧行为：训练后重置为 base，丢弃本地更新）
    # 注意：与 PTopk 残差不建议同时开启（有过补偿风险）。
    local_completion:
      enabled: true             # true = 启用本地补全

  # --------------------------------------------------------------------------
  # ptopk: Packed TopK with Error Feedback（残差累积）
  #
  # 基于 STC (Sparse Ternary Compression, Sattler et al., IEEE TNNLS 2020)
  # 的 Error-Feedback 机制，在同态加密 + 打包框架下的可插拔实现。
  #
  # 【核心思想】
  #   客户端本地维护一个明文残差累加器 r_t。每轮加密上传前，先把残差加到
  #   当前梯度上（补偿），然后应用 TopK/RandK 稀疏化。未被选中的 batch
  #   的梯度信息保留在残差中，累积到下一轮继续尝试上传，避免永久丢失。
  #
  #   数学形式:
  #     r_{t+1} = (Δ_t + r_t) − TopK(Δ_t + r_t)
  #     upload_t = TopK(Δ_t + r_t)
  #
  # 【为什么需要 PTopk】
  #   在打包 (packed) 架构下，全局状态是 {'__packed__': [CT0, CT1]} 格式，
  #   无法像 FedPHE 那样把稀疏的 per-batch 密文直接注入指定 SIMD slot。
  #   因此稀疏聚合后必须解密→明文更新→重新加密，导致未选中 batch 的信息
  #   永久丢失。PTopk 通过客户端残差补偿，把丢失的信息累积到后续轮次。
  #
  # 【服务器累加器（可选）】
  #   服务器端也可以维护一个明文累加器，进一步平滑稀疏化带来的噪声:
  #     • none     = 直接应用每轮聚合 delta（默认，无额外延迟）
  #     • delayed  = 每 K 轮同步一次，期间累加但不应用（减少更新频率）
  #     • momentum = 动量累加器 acc = β·acc + (1−β)·delta（更平滑）
  #
  # 【使用建议】
  #   ┌─────────────┬─────────────┬─────────────┬─────────────────────────────┐
  #   │ 场景        │ enable      │ server_mode │ 说明                        │
  #   ├─────────────┼─────────────┼─────────────┼─────────────────────────────┤
  #   │ 无残差基线  │ false       │ —           │ 标准 TopK，信息永久丢失      │
  #   │ 推荐配置    │ true        │ none        │ 仅客户端残差，服务器正常更新  │
  #   │ 高压缩稳定  │ true        │ delayed     │ 客户端残差 + 服务器延迟同步   │
  #   │ 平滑收敛    │ true        │ momentum    │ 客户端残差 + 服务器动量累加   │
  #   └─────────────┴─────────────┴─────────────┴─────────────────────────────┘
  #
  # 【约束】
  #   - 仅当 sparsification.strategy != "none" 时生效（必须有稀疏化才需要补偿）
  #   - 服务器累加器仅在服务器可解密架构下工作（sparse 路径或明文路径）
  #   - 客户端残差在每次 apply_prefetched_state / 同步全局模型时自动重置
  # --------------------------------------------------------------------------
  ptopk:
    # 总开关（向后兼容）。false = 关闭 PTopk 所有功能。
    # 若需要更细粒度控制，请使用下方的 client_residual / server_accumulator 子段。
    # ⚠️ 当启用 FedPHE 本地补全（local completion）时，建议关闭 PTopk，
    #    避免残差与本地补全叠加导致过补偿。
    enable: false

    # 客户端残差补偿器（Error Feedback）
    # 作用：客户端上传 TopK/RandK 稀疏化时，未被选中的 batch 的梯度信息
    #       会累加到本地残差中，下一轮继续尝试上传，避免信息永久丢失。
    # 注意：仅当 sparsification.strategy != "none" 时生效。
    client_residual:
      enabled: false                # false = 关闭客户端残差补偿（本地补全替代）

      # 跨轮陈旧残差衰减（FedPrefetch 场景专用）
      # 客户端间歇性参与时，旧残差基于旧模型参数，直接叠加会引发动量休克。
      # 本机制按掉线轮数 gap 对残差进行指数衰减：R_new = R_old * stale_gamma^(gap-1)
      #   gap=1（连续参与）: scale=1，残差完全保留
      #   gap=2（跳1轮）   : scale=stale_gamma
      #   gap=3（跳2轮）   : scale=stale_gamma^2
      # 推荐值: 0.5~0.9（1.0=关闭跨轮衰减，backward compatible）
      stale_gamma: 0.5

      # 每轮自然衰减（可选的安全阀）
      # 即使连续参与，若某 batch 连续多轮未被 TopK 选中，其残差会无限增长。
      # decay_gamma 在每轮 update_residual 时对未选中 batch 的残差进行衰减。
      # 推荐值: 1.0（关闭）或 0.9~0.99
      decay_gamma: 0.3

      # 残差范数裁剪阈值（0=关闭）
      # 限制单个 batch 残差的 L2 范数上限，防止异常值爆炸。
      clip_tau: 0.0

    # 服务器明文累加器（Server-side Accumulator）
    # 作用：在服务器端对聚合后的 delta 进行额外平滑处理。
    # 注意：TEE 路径（tee.enabled=true）自动禁用服务器累加器，避免双重补偿。
    server_accumulator:
      enabled: false                   # true = 启用服务器累加器
      mode: "none"                 # "none" | "delayed" | "momentum"
      sync_interval: 1                # delayed 模式: 每隔多少轮同步一次
      momentum_beta: 0.9              # momentum 模式: 动量系数 β

# ============================================================================
# 三（附）、KGC 零和盲化掩码配置 (blinding_mask)
# ============================================================================
# 可插拔隐私增强组件：KGC 为每个客户端生成盲化向量 b_i，满足加权零和约束
#   sum_{i=1}^{n} w_i * b_i = 0
#
# 【核心思想】
#   客户端在加密前将 b_i 加到本地梯度上（upload_i = Enc(g_i + b_i)）。
#   TEE 内加权聚合后，掩码自动抵消（或显式补偿）：
#     sum_i w_i (g_i + b_i) = sum_i w_i g_i + sum_i w_i b_i = sum_i w_i g_i
#
# 【隐私保证】
#   - 对 < n-1 客户端合谋提供信息论隐私保护（即使合谋也无法恢复目标梯度）
#   - 对服务器无额外增益（CKKS 已提供 IND-CPA），但可作为纵深防御
#
# 【与稀疏化的兼容性】
#   - NoSparsification: 所有客户端上传全部 batch，零和自动抵消，无需补偿
#   - TopK / RandK:   不同客户端可能选中不同 batch，子集权重下零和不自动成立。
#     此时 TEE 在聚合后显式减去掩码贡献（compensation_mode=auto 自动处理）
#
# 【使用建议】
#   ┌─────────────┬─────────┬─────────────┬─────────────────────────────────┐
#   │ 场景        │ enabled │ mask_range  │ 说明                            │
#   ├─────────────┼─────────┼─────────────┼─────────────────────────────────┤
#   │ 默认关闭    │ false   │ —           │ 不影响任何现有逻辑              │
#   │ 高隐私要求  │ true    │ 1e6 ~ 1e12  │ 掩码范围越大，隐私越强，但需    │
#   │             │         │             │ 确保 CKKS 精度范围足够          │
#   └─────────────┴─────────┴─────────────┴─────────────────────────────────┘
# ============================================================================
blinding_mask:
  enabled: false                      # true = 启用零和盲化掩码
  mask_range: 1.0                     # 掩码采样范围 [-B, B]，默认 1.0（避免CKKS精度爆炸）
  compensation_mode: "auto"           # "auto" | "always" | "never"
                                      #   auto:   仅稀疏化时显式补偿（推荐）
                                      #   always: 总是显式补偿
                                      #   never:  从不补偿（仅 NoSparsification）
  apply_mode: "post_topk"             # "pre_topk" | "post_topk"
                                      #   pre_topk:  训练后全参数加掩码，再TopK选择（旧方案）
                                      #   post_topk: 先TopK选择batch，再给选中batch加掩码（新方案，推荐）

# ============================================================================
# ============================================================================
# 四、全局掩码投票配置 (global_mask_vote)
# ============================================================================
# 服务器端 mask 聚合策略。客户端只上传 0/1 mask，服务器聚合后生成 global_mask。
#
# 【核心思想】
#   隐私安全设计：客户端在本地计算 mask（基于本地梯度），只上传 mask（0/1 向量）
#   给服务器。服务器聚合所有 client masks 生成全局掩码，广播给所有客户端。
#   所有客户端按全局掩码加密上传密文，服务器永远看不到明文梯度。
#
# 【与 sparsification 的关系】
#   • sparsification.strategy = "none" 时：
#     客户端不计算 mask，global_mask_vote 被忽略，上传完整加密梯度。
#   • sparsification.strategy != "none" 时：
#     客户端按 sparsification 配置（sparsity_rate, scoring_method）本地算 mask。
#     服务器按 global_mask_vote 配置（mode, threshold_pct, topk_count_k）聚合 mask。
#
# 【约束】
#   - mode != "none" 时，所有客户端都需要按全局掩码上传密文
#   - 与 TEE 路径不冲突（TEE 开启时投票仍然有效）
# ============================================================================
global_mask_vote:
  mode: "none"                       # "none" | "union" | "threshold" | "topk"
                                      #   none      = 关闭全局投票（客户端独立稀疏化）
                                      #   union     = 并集（所有客户端选中位置的并集）
                                      #   threshold = 阈值（超过 θ% 客户端选中才纳入）
                                      #   topk      = TopK 计数（按选中次数取前 K 个）
  threshold_pct: 0.5                # threshold 模式：超过 20% 客户端选中才纳入
  topk_count_k: 20                  # topk 模式：取选中次数前 K 的 batch
                                      #   ⚠️ 建议 ≥ 总 batch 数的 20%，避免覆盖率过低
                                      #   例如 67 个 batch 时，k=20 可覆盖 30%
  topk_pct: 0.1

# ============================================================================
# 四（附·二）、ESAFL 配置 (esafl)
# ============================================================================
# ESAFL 去 TEE 隐私框架的可插拔适配器。
#
# 【核心思想】
#   用密文同态减法计算 delta（δ^(r) = C^(r) - C^(r-1)），替代传统的
#   明文差值 + 重新加密。delta 密文可直接用于 Prefetch 广播，
#   省去服务器每轮加密开销。
#
# 【与标准路径的区别】
#   - 标准路径：服务器聚合后更新明文模型 → 计算明文 delta → 重新加密
#   - ESAFL 路径：服务器聚合后直接得到密文全局状态 → 同态减法得 delta
#
# 【约束】
#   - 仅支持 SIMULATION 模式（TenSEAL 单密钥）
#   - NATIVE 模式需要真正的多密钥 CKKS 支持（未来扩展）
#   - 与全局掩码投票配合使用效果最佳
# ============================================================================
esafl:
  enabled: true                      # true = 启用 ESAFL 密文 delta 路径
  mode: "SIMULATION"                  # SIMULATION = 单密钥模拟 | NATIVE = 多密钥（未实现）
  prpg_seed: 42                       # PRPG 伪随机多项式生成器种子

# 四（附·三）、TEE 可信执行环境配置 (tee)
# ============================================================================
# TEE 路径（方案①）：在模拟可信执行环境内执行明文聚合 + 全局残差累加 + 二次压缩。
# 真实部署时对应 SGX/TrustZone enclave，单机实验时为 Python 模拟器。
#
# 【核心思想】
#   服务器持有 CKKS 私钥，在 TEE 内解密客户端上传 → 明文聚合 → 全局残差补偿 →
#   包级 TopK 二次压缩 → 重新加密返回 Host。Host 只负责密文减法和下发稀疏 delta。
#
# 【与标准路径的区别】
#   - 标准路径：Host 侧同态聚合（CKKS 加权平均），无全局残差，下发完整密文模型
#   - TEE 路径：TEE 内明文聚合，维护全局残差 R_t，下发稀疏 delta（通信量更低）
#
# 【约束】
#   - TEE 开启时，Host 侧 PTopk 服务器累加器自动禁用（避免双重补偿）
#   - TEE 开启时，客户端 PTopk 残差仍然有效（补偿上行压缩损失）
#   - 需要 ckks_manager 持有私钥（TenSEAL context 含 secret_key）
# ============================================================================
tee:
  enabled: false                      # true = 启用 TEE 路径

  # TEE 内部下行压缩（二次稀疏化）配置
  # 作用：TEE 在明文聚合后，可选择对下行 delta 执行 TopK 压缩，减少预取通信量。
  #       同时维护全局残差（global_residual）补偿未选中 batch。
  # 关闭时：TEE 只做明文聚合 + 全量加密回传，不维护全局残差。
  compression:
    enabled: false                     # true = 启用 TEE 内 TopK 压缩 + 全局残差
    sparsity_rate: 0.8               # 压缩比例（仅 enabled=true 时生效）

  # TEE 全局残差处理策略（可插拔，防止高压缩率下残差无限累积）
  # 作用：控制 TEE 在 compression 模式下维护的全局残差行为。
  #   - none:     默认行为，残差 100% 保留（原逻辑）
  #   - decay:    未选中 batch 的历史残差按 gamma 折扣（如 0.9 = 每轮衰减 10%）
  #   - clipping: 包级 L2 范数裁剪，限制单 batch 更新步长上限
  #   - both:     同时启用 decay + clipping（推荐）
  # 注意：仅当 compression.enabled=true 时生效。
  residual_strategy:
    mode: "decay"                      # "none" | "decay" | "clipping" | "both"
    decay_gamma: 0.9                 # decay 模式用：历史残差衰减因子 (0,1)
    clip_tau: 0.0                     # clipping 模式用：L2 范数阈值；0 = 自动（滑动平均+3σ）
    clip_window: 4                    # 自动阈值的历史窗口轮数

# ============================================================================
# 五、CipherFetch 密文预取配置 (prefetch)
# ============================================================================
# 本组参数控制 FedFetch 风格的密文预取（CipherFetch）行为。
# 预取的核心思想：未被选中的客户端在后台（idle 时）通过同态加法累加服务器
# 广播的密文增量，从而在下次被选中时减少 fetch 延迟。
prefetch:
  # --------------------------------------------------------------------------
  # enable_prefetch: 是否启用 CipherFetch 预取
  #   建议取值: [true, false]
  #   说明: false 时退化为标准 CKKS-Fed（无预取、无带宽模拟、无 sticky sampling）。
  # --------------------------------------------------------------------------
  enable_prefetch: false

  # --------------------------------------------------------------------------
  # max_prefetch_round: 最大提前预取轮数（预取窗口大小 W）
  #   建议取值: [1, 2, 3, 5]
  #   说明: 服务器在第 R 轮会为第 R+W 轮的客户端决定预取调度。
  #   W 越大，预取越激进，但调度误差（EMA 估计不准）也越大。推荐 2~3。
  # --------------------------------------------------------------------------
  max_prefetch_round: 3

  # --------------------------------------------------------------------------
  # warmup_round: 预热轮数（前 N 轮不调度预取、不广播密文增量）
  #   建议取值: [0, 1, 2, 3]
  #   说明: 预热期间收集 EMA 轮次耗时和带宽基线，为后续调度提供数据。
  #   论文中 rounds 1..R 的训练客户端不是被预采样的，但系统仍可为 future rounds 预取。
  #   设为 0 表示从第 1 轮就开始预取调度。
  # --------------------------------------------------------------------------
  warmup_round: 1

  # --------------------------------------------------------------------------
  # scheduler_beta: T_percentile 松弛系数
  #   建议取值: [0.0, 0.3, 0.5, 0.7, 1.0]
  #   说明: 控制调度器对"慢客户端"的容忍度。
  #     • β = 0   最严格（只有最快客户端能被成功预取）
  #     • β = 0.5 平衡（默认推荐）
  #     • β = 1   最宽松（几乎所有客户端都能被调度预取）
  #   仅当 overcommitment > 1 时效果才明显。
  # --------------------------------------------------------------------------
  scheduler_beta: 1.0

  # --------------------------------------------------------------------------
  # overcommitment (OC): 过承诺比例
  #   建议取值: [1.0, 1.5, 2.0, 3.0]
  #   说明:
  #     • OC = 1.0  预采样数 = 实际需要数（无冗余）
  #     • OC = 2.0  预采样数 = 2 × 实际需要数（推荐配合 sticky 策略使用）
  #     • OC 越大，预采样池越大，但预取广播量也线性增加。
  #   注意: sticky 策略下实际预采样数 = min(group_size, num_needed*OC - change_num) + change_num
  # --------------------------------------------------------------------------
  overcommitment: 1.3


# ============================================================================
# 六、带宽模拟配置 (bandwidth)
# ============================================================================
# 用于模拟异构网络环境，影响 PrefetchScheduler 的调度决策和虚拟时钟计算。
bandwidth:
  # --------------------------------------------------------------------------
  # fedfetch_trace_path: FedFetch 真实带宽 trace 文件路径
  #   说明: 如果设置且文件存在，优先使用 FedFetch 论文中的真实移动设备
  #         带宽数据（Measurement Lab NDT 数据集，9242 个客户端），
  #         覆盖下方的合成带宽参数。
  #         中位数 DL ≈ 81 Mbps，UL ≈ 18 Mbps，高度异构。
  #   设为 null 则使用下方合成带宽参数。
  # --------------------------------------------------------------------------
  fedfetch_trace_path: "fedfetch_bandwidth.pkl"

  # --------------------------------------------------------------------------
  # base_dl_bw: 基础下行带宽 (kbps)
  #   建议取值: [256.0, 512.0, 1024.0, 2048.0, 4096.0, 10240.0]
  #   说明:
  #     • 256~512   kbps  ≈ 2G/3G 移动网络
  #     • 1024~2048 kbps  ≈ 4G / 家庭 WiFi
  #     • 4096+     kbps  ≈ 5G / 光纤
  #   实际带宽 = base_dl_bw × uniform/lognormal 随机因子。
  #   当 fedfetch_trace_path 有效时，此参数被忽略。
  # --------------------------------------------------------------------------
  base_dl_bw: 1024.0

  # --------------------------------------------------------------------------
  # base_ul_bw: 基础上行带宽 (kbps)
  #   建议取值: [128.0, 256.0, 512.0, 1024.0]
  #   说明: 上行通常比下行慢，建议设为下行的 0.3~0.5 倍。
  #   当 fedfetch_trace_path 有效时，此参数被忽略。
  # --------------------------------------------------------------------------
  base_ul_bw: 512.0

  # --------------------------------------------------------------------------
  # variance: 带宽变异系数 [0, 1)
  #   建议取值: [0.1, 0.3, 0.5, 0.7]
  #   说明: 越大客户端间带宽差异越大。
  #     • 0.1  几乎同构（所有客户端带宽相近）
  #     • 0.3  中度异构（默认推荐）
  #     • 0.5+ 高度异构（模拟极端设备差异）
  #   当 fedfetch_trace_path 有效时，此参数被忽略。
  # --------------------------------------------------------------------------
  variance: 0.3

  # --------------------------------------------------------------------------
  # distribution: 带宽分布类型
  #   建议取值: ["uniform", "lognormal"]
  #   说明:
  #     • uniform    带宽在 [base×(1-var), base×(1+var)] 内均匀分布
  #     • lognormal  更符合真实网络：多数客户端接近均值，少数极慢/极快
  #   当 fedfetch_trace_path 有效时，此参数被忽略。
  # --------------------------------------------------------------------------
  distribution: "lognormal"

  # --------------------------------------------------------------------------
  # filter_low_bandwidth: 低带宽客户端过滤开关
  #   说明: true = 过滤掉上下行任意一个带宽低于阈值的客户端。
  #         只在加载 FedFetch trace 或生成合成带宽时生效。
  #         过滤后从中随机采样 num_clients 个高带宽客户端。
  #         false = 保持原有逻辑，不过滤（默认）。
  #   用途: 排除极端低速客户端（如 2G 网络），使实验更聚焦于高带宽场景。
  # --------------------------------------------------------------------------
  filter_low_bandwidth: true

  # --------------------------------------------------------------------------
  # min_dl_bw_kbps / min_ul_bw_kbps: 带宽过滤阈值 (kbps)
  #   说明: 仅当 filter_low_bandwidth=true 时生效。
  #         客户端必须同时满足 DL≥min_dl_bw_kbps 且 UL≥min_ul_bw_kbps 才被保留。
  #   建议: 10 Mbps = 10240 kbps（排除 4G 以下设备）
  #         1 Mbps = 1024 kbps（仅排除 2G/3G）
  # --------------------------------------------------------------------------
  min_dl_bw_kbps: 5120  #1024 1Mbps   #5120 5Mbps  #10240 = 10Mbps
  min_ul_bw_kbps: 5120

  # --------------------------------------------------------------------------
  # max_dl_bw_kbps / max_ul_bw_kbps: 最高带宽限制 (kbps)
  #   说明: 始终生效（默认 inf 不限制）。生成/加载带宽后，超过此值的会被截断。
  #         与 min 配合可同时限制带宽上下界，形成窄带场景。
  #   建议: 与 base_dl_bw 设为相同值 = 硬上限（所有客户端 ≤ base）
  #         设为 inf (或注释掉) = 不限制上限
  #   示例: max_dl_bw_kbps: 10240  # 下行最高 10 Mbps
  #         max_ul_bw_kbps: 5120   # 上行最高 5 Mbps
  # --------------------------------------------------------------------------
  # max_dl_bw_kbps: .inf
  # max_ul_bw_kbps: .inf


# ============================================================================
# 七、实验指标配置 (metrics)
# ============================================================================
# 控制哪些指标被记录到 results/metrics.json 中。
# 全部为布尔开关，true = 记录，false = 跳过。
metrics:
  compute_time: true
  communication_cost: true
  ciphertext_size: true
  expansion_ratio: true
  accuracy: true
  loss: true
  communication_rounds: true
  dropout_rate: true
  cpu_utilization: true
  key_distribution_cost: true
  memory_usage: true


# ============================================================================
# 八、可视化配置 (visualization)
# ============================================================================
visualization:
  enabled: true
  save_format: "png"                # 建议: ["png", "pdf", "svg"]
  dpi: 300                          # 建议: [150, 300, 600]
  figure_size: [10, 6]              # 建议: [8,5], [10,6], [12,8]
  style: "seaborn-v0_8-whitegrid"   # 建议: ["seaborn-v0_8-whitegrid", "ggplot", "bmh"]


# ============================================================================
# 九、输出配置 (output)
# ============================================================================
output:
  results_dir: "AAAAA_Rework/FedPHE/result"
  model_dir: "./history_models"     # 每轮模型 checkpoint 保存目录
  viz_dir: "./visualization"        # 可视化图表保存目录
  save_interval: 999                # 每 N 轮保存一次模型；设为 999 可仅保存最终模型

bandwidth:
  base_dl_bw: 1024.0
  base_ul_bw: 512.0
  distribution: lognormal
  fedfetch_trace_path: fedfetch_bandwidth.pkl
  variance: 0.3
blinding_mask:
  enabled: false
ckks:
  coeff_mod_bit_sizes:
  - 60
  - 40
  - 40
  - 60
  global_scale: 1099511627776
  packing:
    quant_bits: 16
    strategy: merged
  poly_modulus_degree: 8192
  slot_packing: true
  sparsification:
    batch_size: 4096
    local_completion:
      enabled: false
    scoring_method: l2_norm
    seed: 42
    sparsity_rate: 0.1
    strategy: none
    use_warmup_skip_sparse: false
    warmup_rounds: 2
client_selection:
  quan_threshold: 0.05
  selection_interval: 0
  sim_len: 64
  strategy: random
data:
  alpha: 0.5
  data_dir: ./data
  dataset: cifar10
  iid: false
  num_classes: 10
esafl:
  enabled: false
global_mask_vote:
  mode: none
metrics:
  accuracy: true
  ciphertext_size: true
  communication_cost: true
  compute_time: true
  expansion_ratio: true
  loss: true
model:
  deepcnn_width: 32
  dropout: 0.2
  hidden_dims:
  - 256
  - 128
  name: cnn_cifar
  width_mult: 1.0
output:
  model_dir: ./history_models
  results_dir: E:\GithubProjects\ckks_fed_robustness\compare_analysis\deep_model_test\cnn_cifar_merged_gc0_uc0
  save_interval: 999
  viz_dir: ./visualization
prefetch:
  enable_prefetch: false
ptopk:
  enable: false
system:
  batch_size: 64
  client_sampling_rate: 0.3
  device: cpu
  gradient_clipping:
    enabled: false
    max_norm: 1.0
  learning_rate: 0.0005
  lr_scheduler:
    enabled: false
  num_clients: 100
  num_epochs: 2
  num_rounds: 1
  optimizer:
    lr: 0.0005
    momentum: 0.9
    name: adam
  random_seed: 42
  run_plaintext_baseline: false
  update_clipping:
    clip_factor: 3.0
    enabled: false
    method: layerwise_mean
  upload_difference: true
tee:
  enabled: false
visualization:
  enabled: false

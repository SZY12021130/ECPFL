  sim_len: 64
  sticky:
    change_num_base: 3
    enable_score: false
    group_size: null
    score_decay: 0.9
  strategy: random
  tifl:
    num_tiers: null
data:
  alpha: 0.5
  data_dir: ./data
  dataset: cifar10
  iid: false
  num_classes: 10
esafl:

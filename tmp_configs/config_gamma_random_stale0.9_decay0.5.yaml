bandwidth:
  base_dl_bw: 1024.0
  base_ul_bw: 512.0
  distribution: lognormal
  fedfetch_trace_path: fedfetch_bandwidth.pkl
  variance: 0.3
blinding_mask:
  apply_mode: post_topk
  compensation_mode: auto
  enabled: false
  mask_range: 1.0
ckks:
  coeff_mod_bit_sizes:
  - 40
  - 20
  - 40
  global_scale: 1048576
  packing:
    quant_bits: 16
    strategy: layerwise
  poly_modulus_degree: 4096
  ptopk:
    client_residual:
      clip_tau: 0.0
      decay_gamma: 0.5
      enabled: true
      stale_gamma: 0.9
    enable: true
    server_accumulator:
      enabled: false
      mode: none
      momentum_beta: 0.9
      sync_interval: 1
  slot_packing: true
  sparsification:
    batch_size: 4096
    local_completion:
      enabled: false
    scoring_method: l2_norm
    seed: 42
    sparsity_rate: 0.1
    strategy: topk
    use_warmup_skip_sparse: true
    warmup_rounds: 2
client_selection:
  fairness:
    enabled: false
    min_participation_ratio: 0.3
  max_k: null
  quan_threshold: 0.05
  selection_interval: 10
  sim_len: 64
  strategy: random
data:
  alpha: 1.0
  data_dir: ./data
  dataset: mnist
  iid: false
  num_classes: 10
metrics:
  accuracy: true
  ciphertext_size: true
  communication_cost: true
  communication_rounds: true
  compute_time: true
  cpu_utilization: true
  dropout_rate: true
  expansion_ratio: true
  key_distribution_cost: true
  loss: true
  memory_usage: true
model:
  block_config:
  - 6
  - 6
  - 6
  bn_size: 4
  drop_rate: 0.0
  dropout: 0.2
  growth_rate: 12
  hidden_dims:
  - 256
  - 128
  name: lenet
  num_init_features: 24
  width_mult: 1.0
output:
  model_dir: ./history_models
  results_dir: ./results
  save_interval: 999
  viz_dir: ./visualization
prefetch:
  enable_prefetch: true
  max_prefetch_round: 3
  overcommitment: 2.0
  scheduler_beta: 1.0
  sticky_change_num: 1
  sticky_decay: 0.9
  sticky_group_size: 8
  use_sticky_sampling: true
  warmup_round: 1
system:
  batch_size: 64
  client_sampling_rate: 0.5
  device: cpu
  learning_rate: 0.001
  lr_scheduler:
    T_max: 30
    enabled: false
    eta_min: 0.0
    gamma: 0.5
    name: step
    step_size: 10
  num_clients: 10
  num_epochs: 3
  num_rounds: 10
  optimizer:
    lr: 0.001
    momentum: 0.9
    name: adam
  random_seed: 42
  run_plaintext_baseline: false
  upload_difference: true
tee:
  compression:
    enabled: false
    sparsity_rate: 0.1
  enabled: false
  residual_strategy:
    clip_tau: 0.0
    clip_window: 4
    decay_gamma: 0.9
    mode: both
visualization:
  dpi: 300
  enabled: true
  figure_size:
  - 10
  - 6
  save_format: png
  style: seaborn-v0_8-whitegrid

# ============================================================================
# MASER模式配置文件 - SVHN
# ============================================================================
# 基于CKKS-Fed框架的MASER风格投票机制实验
# ============================================================================

# ============================================================================
# 一、系统配置 (system)
# ============================================================================
system:
  num_clients: 25                     # 客户端总数
  num_rounds: 50                      # 训练轮数
  num_epochs: 3                      # 本地epoch数
  batch_size: 64                     # 批次大小
  learning_rate: 0.001               # 学习率
  device: "cpu"                    # 训练设备
  random_seed: 42                    # 随机种子
  run_plaintext_baseline: false      # 是否运行明文基线
  client_sampling_rate: 1.0          # 客户端采样率（1.0=全参与）
  upload_difference: true            # 上传差值

  optimizer:
    name: "adam"
    lr: 0.001
    momentum: 0.9

  lr_scheduler:
    enabled: false

# ============================================================================
# 二、数据集配置 (data)
# ============================================================================
data:
  dataset: "svhn"
  data_dir: "./data"
  num_classes: 10
  iid: false                         # Non-IID划分
  alpha: 1.0                         # Dirichlet参数

# ============================================================================
# 三、模型配置 (model)
# ============================================================================
model:
  name: "cnn"                        # SVHN用CNN

# ============================================================================
# 四、CKKS配置 (ckks)
# ============================================================================
ckks:
  poly_modulus_degree: 8192
  coeff_mod_bit_sizes: [40, 20, 40]
  global_scale: 1048576               # 2^20
  slot_packing: true

# ============================================================================
# 五、预取配置 (prefetch)
# ============================================================================
prefetch:
  enabled: false                     # 关闭预取，使用标准CKKS

# ============================================================================
# 六、MASER投票模式配置 (maser)
# ============================================================================
maser:
  enable: true                       # 启用MASER模式
  topk_ratio: 0.5                   # 客户端本地保留50%梯度
  voting_threshold: 0.5              # 服务器阈值：超过50%客户端选中才纳入
  use_server_threshold: true         # 使用阈值筛选

# ============================================================================
# 七、稀疏化配置 (sparsification) - MASER启用时关闭
# ============================================================================
sparsification:
  strategy: "none"                   # 关闭batch-level topk
  sparsity_rate: 0.1
  batch_size: 4096
  seed: 42
  scoring_method: "l2_norm"
  use_warmup_skip_sparse: false
  warmup_rounds: 2
  local_completion:
    enabled: false

# ============================================================================
# 八、PTopk配置 - MASER启用时关闭
# ============================================================================
ptopk:
  enable: false
  client_residual:
    enabled: false
    stale_gamma: 0.5
    decay_gamma: 0.3
    clip_tau: 0.0
  server_accumulator:
    enabled: false
    mode: "none"
    sync_interval: 1
    momentum_beta: 0.9

# ============================================================================
# 九、全局掩码投票配置 - MASER启用时关闭
# ============================================================================
global_mask_vote:
  mode: "none"

# ============================================================================
# 十、输出配置 (output)
# ============================================================================
output:
  results_dir: "./accuracy_baseline/maser/result"
  model_dir: "./history_models"
  viz_dir: "./visualization"
  save_interval: 999

# ============================================================================
# 十一、指标配置 (metrics)
# ============================================================================
metrics:
  compute_time: true
  communication_cost: true
  ciphertext_size: true
  expansion_ratio: true
  accuracy: true
  loss: true
  communication_rounds: true
  dropout_rate: true
  cpu_utilization: true
  key_distribution_cost: true
  memory_usage: true
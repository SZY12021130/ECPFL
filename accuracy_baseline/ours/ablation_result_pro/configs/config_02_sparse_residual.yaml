client_selection:
  strategy: sticky
  sim_len: 64
  quan_threshold: 0.05
  selection_interval: 0
  max_k: null
  sticky:
    group_size: null
    change_num_base: 3
    enable_score: false
    score_decay: 0.9
  poc:
    d: null
  tifl:
    num_tiers: null
  haccs:
    num_clusters: null
    recluster_interval: 0
  oort:
    exploration_factor: 0.1
    util_time_alpha: 1.0
  fairness:
    enabled: false
    min_participation_ratio: 0.3
system:
  num_clients: 50
  num_rounds: 50
  num_epochs: 3
  batch_size: 64
  learning_rate: 0.001
  device: cuda
  random_seed: 42
  run_plaintext_baseline: false
  client_sampling_rate: 0.5
  upload_difference: true
  optimizer:
    name: adam
    lr: 0.001
    momentum: 0.9
  lr_scheduler:
    enabled: false
    name: step
    step_size: 10
    gamma: 0.5
    T_max: 30
    eta_min: 0.0
data:
  dataset: svhn
  data_dir: ./data
  num_classes: 10
  iid: false
  alpha: 1.0
model:
  name: resnet20
  hidden_dims:
  - 256
  - 128
  dropout: 0.2
  width_mult: 1.0
  growth_rate: 12
  block_config:
  - 6
  - 6
  - 6
  num_init_features: 24
  bn_size: 4
  drop_rate: 0.0
  vocab_size: 80
  embed_dim: 8
  hidden_dim: 256
  num_layers: 2
  lstm_dropout: 0.5
  shufflenet_groups: 3
  shufflenet_width: 1.0
ckks:
  poly_modulus_degree: 8192
  coeff_mod_bit_sizes:
  - 60
  - 40
  - 40
  - 60
  global_scale: 1099511627776
  slot_packing: true
  packing:
    strategy: merged
    crt_layers: 4
    crt_quant_bits: 8
    quant_bits: 16
  sparsification:
    strategy: topk
    sparsity_rate: 0.5
    batch_size: 4096
    seed: 42
    scoring_method: l2_norm
    use_warmup_skip_sparse: false
    warmup_rounds: 2
    local_completion:
      enabled: false
  ptopk:
    enable: true
    client_residual:
      enabled: true
      stale_gamma: 1.0
      decay_gamma: 1.0
      clip_tau: 0.0
    server_accumulator:
      enabled: false
      mode: none
blinding_mask:
  enabled: false
  mask_range: 1.0
  compensation_mode: auto
  apply_mode: post_topk
global_mask_vote:
  mode: union
  threshold_pct: 0.5
  topk_count_k: 20
  topk_pct: 0.7
esafl:
  enabled: false
  mode: SIMULATION
  prpg_seed: 42
tee:
  enabled: false
  compression:
    enabled: false
    sparsity_rate: 0.8
  residual_strategy:
    mode: decay
    decay_gamma: 0.9
    clip_tau: 0.0
    clip_window: 4
prefetch:
  enable_prefetch: false
  max_prefetch_round: 0
  warmup_round: 0
  scheduler_beta: 1.0
  overcommitment: 1.3
bandwidth:
  fedfetch_trace_path: fedfetch_bandwidth.pkl
  base_dl_bw: 1024.0
  base_ul_bw: 512.0
  variance: 0.3
  distribution: lognormal
  filter_low_bandwidth: true
  min_dl_bw_kbps: 5120
  min_ul_bw_kbps: 5120
  max_dl_bw_kbps: .inf
  max_ul_bw_kbps: .inf
metrics:
  compute_time: true
  communication_cost: true
  ciphertext_size: true
  expansion_ratio: true
  accuracy: true
  loss: true
  communication_rounds: true
  dropout_rate: true
  cpu_utilization: true
  key_distribution_cost: true
  memory_usage: true
visualization:
  enabled: true
  save_format: png
  dpi: 300
  figure_size:
  - 10
  - 6
  style: seaborn-v0_8-whitegrid
output:
  results_dir: accuracy_baseline/ours/ablation_result_pro/02_sparse_residual
  model_dir: ./history_models
  viz_dir: ./visualization
  save_interval: 999

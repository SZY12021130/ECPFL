bandwidth:
  base_dl_bw: 10240.0
  base_ul_bw: 10240.0
  distribution: lognormal
  fedfetch_trace_path: fedfetch_bandwidth.pkl
  filter_low_bandwidth: true
  min_dl_bw_kbps: 5120
  min_ul_bw_kbps: 5120
  variance: 0.3
blinding_mask:
  apply_mode: post_topk
  compensation_mode: auto
  enabled: false
  mask_range: 1.0
ckks:
  coeff_mod_bit_sizes:
  - 60
  - 40
  - 40
  - 60
  global_scale: 1099511627776
  packing:
    strategy: merged
  poly_modulus_degree: 8192
  ptopk:
    client_residual:
      clip_tau: 0.0
      decay_gamma: 0.3
      enabled: false
      stale_gamma: 0.5
    enable: false
    server_accumulator:
      enabled: false
      mode: none
      momentum_beta: 0.9
      sync_interval: 1
  slot_packing: true
  sparsification:
    batch_size: 4096
    local_completion:
      enabled: true
    scoring_method: l2_norm
    seed: 42
    sparsity_rate: 0.5
    strategy: topk
    use_warmup_skip_sparse: false
    warmup_rounds: 0
client_selection:
  strategy: random
data:
  alpha: 0.1
  data_dir: ./data
  dataset: cifar10
  iid: false
  num_classes: 10
esafl:
  enabled: true
  mode: SIMULATION
  prpg_seed: 42
global_mask_vote:
  mode: none
  threshold_pct: 0.5
  topk_count_k: 20
  topk_pct: 0.1
model:
  dropout: 0.2
  hidden_dims:
  - 256
  - 128
  name: resnet20
output:
  model_dir: ./models
  results_dir: accuracy_baseline/esafl/noneiid_result
  save_interval: 5
system:
  batch_size: 64
  client_sampling_rate: 1.0
  device: cuda
  learning_rate: 0.001
  lr_scheduler:
    enabled: false
  num_clients: 25
  num_epochs: 3
  num_rounds: 50
  optimizer:
    lr: 0.001
    momentum: 0.9
    name: adam
  random_seed: 42
  run_plaintext_baseline: false
  upload_difference: true
tee:
  enabled: false

# ============================================================================
# CKKS-Fed / ESAFL 联邦学习实验配置文件
# 配置：25客户端，50轮，alpha=1（轻度Non-IID），所有客户端参与
# 打包方式：ESAFL比特级打包
# 关键：关闭预取策略（ESAFL不含预取机制）
# ============================================================================

client_selection:
  strategy: "random"

system:
  num_clients: 25
  num_rounds: 50
  num_epochs: 3
  batch_size: 64
  learning_rate: 0.001
  device: "cuda"
  random_seed: 42
  run_plaintext_baseline: false
  client_sampling_rate: 1.0
  upload_difference: true
  optimizer:
    name: "adam"
    lr: 0.001
    momentum: 0.9
  lr_scheduler:
    enabled: false

data:
  dataset: "cifar10"
  data_dir: "./data"
  num_classes: 10
  iid: false
  alpha: 1

model:
  name: "cnn"
  hidden_dims: []
  dropout: 0.0

ckks:
  poly_modulus_degree: 8192
  coeff_mod_bit_sizes: [60, 40, 40, 60]
  global_scale: 1099511627776
  slot_packing: true
  packing:
    # ESAFL 比特级打包策略
    strategy: "esafl"
    # ESAFL 参数：logq0 = 15（平衡精度与编码范围）
    logq0: 15
    # ESAFL 原论文参数：logP = 120
    logP: 120
    # 打包批次大小：slots2 = floor(logP / (logq0 + pad))
    # pad = ceil(log2(25)) + 1 = 5 + 1 = 6
    # 但为避免打包值溢出，限制slots2=2
    slots2: 2
    # 量化比特
    quant_bits: 15
  # 关闭稀疏化，使用完整梯度
  sparsification:
    strategy: "none"
    sparsity_rate: 0.0
    batch_size: 4096
    seed: 42
    scoring_method: "l2_norm"
    use_warmup_skip_sparse: false
    warmup_rounds: 0
    local_completion:
      enabled: false
  # 关键：关闭预取策略（ESAFL不含预取机制）
  ptopk:
    enable: false
    client_residual:
      enabled: false
      stale_gamma: 0.5
      decay_gamma: 0.3
      clip_tau: 0.0
    server_accumulator:
      enabled: false
      mode: "none"
      sync_interval: 1
      momentum_beta: 0.9

blinding_mask:
  enabled: false
  mask_range: 1.0
  compensation_mode: "auto"
  apply_mode: "post_topk"

global_mask_vote:
  mode: "none"
  threshold_pct: 0.5
  topk_count_k: 20
  topk_pct: 0.1

# ESAFL 配置
esafl:
  enabled: true
  mode: "SIMULATION"
  prpg_seed: 42

tee:
  enabled: false

output:
  results_dir: "./accuracy_baseline/esafl/result"
  model_dir: "./models"
  save_interval: 5

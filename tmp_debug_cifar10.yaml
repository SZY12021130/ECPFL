# ============================================================================
# CKKS-Fed / ESAFL 调试配置 (CIFAR-10, quant_bits=16, slots2=3, 1轮)
# ============================================================================

client_selection:
  strategy: "random"

system:
  num_clients: 25
  num_rounds: 1
  num_epochs: 3
  batch_size: 64
  learning_rate: 0.001
  device: "cuda"
  random_seed: 42
  run_plaintext_baseline: false
  client_sampling_rate: 1.0
  upload_difference: true
  optimizer:
    name: "adam"
    lr: 0.001
    momentum: 0.9
  lr_scheduler:
    enabled: false

data:
  dataset: "cifar10"
  data_dir: "./data"
  num_classes: 10
  iid: false
  alpha: 1

model:
  name: "resnet20"
  hidden_dims: [256, 128]
  dropout: 0.2

ckks:
  poly_modulus_degree: 8192
  coeff_mod_bit_sizes: [60, 40, 40, 60]
  global_scale: 1099511627776
  slot_packing: true
  packing:
    strategy: "esafl"
    logq0: 16
    slots2: 3
    quant_bits: 16
  sparsification:
    strategy: null
    sparsity_rate: 0.0
    batch_size: 4096
    seed: 42
    scoring_method: "l2_norm"
    use_warmup_skip_sparse: false
    warmup_rounds: 0
    local_completion:
      enabled: false
  ptopk:
    enable: false

blinding_mask:
  enabled: false

global_mask_vote:
  mode: "none"

esafl:
  enabled: true
  mode: "SIMULATION"
  prpg_seed: 42

tee:
  enabled: false

output:
  results_dir: "accuracy_baseline/esafl/debug"
  model_dir: "./models"
  save_interval: 1
